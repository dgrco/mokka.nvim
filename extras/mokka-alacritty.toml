# Mokka — Alacritty terminal theme
# Place in ~/.config/alacritty/themes/ and import with:
#   import:
#     - ~/.config/alacritty/themes/mokka.toml

[colors.primary]
background = "#232323"
foreground = "#c8c6c0"
dim_foreground = "#626058"
bright_foreground = "#eeeee8"

[colors.cursor]
text   = "#232323"
cursor = "#c8c6c0"

[colors.vi_mode_cursor]
text   = "#232323"
cursor = "#66d9ef"

[colors.search.matches]
foreground = "#232323"
background = "#e6db74"

[colors.search.focused_match]
foreground = "#232323"
background = "#fd971f"

[colors.hints.start]
foreground = "#232323"
background = "#e6db74"

[colors.hints.end]
foreground = "#232323"
background = "#fd971f"

[colors.selection]
text       = "#eeeee8"
background = "#3c3c3c"

[colors.normal]
black   = "#232323"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#e6db74"
blue    = "#66d9ef"
magenta = "#ae81ff"
cyan    = "#66d9ef"
white   = "#c8c6c0"

[colors.bright]
black   = "#505050"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#e6db74"
blue    = "#66d9ef"
magenta = "#f92672"
cyan    = "#66d9ef"
white   = "#eeeee8"

[colors.dim]
black   = "#2b2b2b"
red     = "#f92672"
green   = "#a6e22e"
yellow  = "#e6db74"
blue    = "#66d9ef"
magenta = "#ae81ff"
cyan    = "#66d9ef"
white   = "#929088"
