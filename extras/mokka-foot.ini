# Mokka — foot terminal theme
# https://codeberg.org/dnkl/foot/wiki#themes
#
# Place in ~/.config/foot/themes/mokka and load with:
#   include=~/.config/foot/themes/mokka

[colors-dark]
background=232323
foreground=c8c6c0

selection-background=3c3c3c
selection-foreground=eeeee8

cursor=232323 c8c6c0

