regular1=f92672
regular2=a6e22e
regular3=e6db74
regular4=66d9ef
regular5=ae81ff
regular6=66d9ef
regular7=c8c6c0

bright0=505050
bright1=f92672
bright2=a6e22e
bright3=e6db74
bright4=66d9ef
bright5=f92672
bright6=66d9ef
bright7=eeeee8

# Dim colours (foot supports these natively)
dim0=2b2b2b
dim1=f92672
dim2=a6e22e
dim3=e6db74
dim4=66d9ef
dim5=ae81ff
dim6=66d9ef
dim7=929088

